# ==============================================================================
# NODE7 UI ACE PERMISSIONS
# Execute this file before ensuring node7-ui:
#   exec @node7-ui/permissions.cfg
#   ensure node7-ui
# ==============================================================================

# NODE7 permission objects.
add_ace group.node7_admin node7.ui.admin allow
add_ace group.node7_admin node7.ui.test allow

add_ace group.node7_owner node7.ui.admin allow
add_ace group.node7_owner node7.ui.test allow

# Standard CFX compatibility.
add_ace group.admin node7.ui.admin allow
add_ace group.admin node7.ui.test allow

